apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-enrichment-consumer
  namespace: observability
  labels: { app: obs-enrichment-consumer }
spec:
  replicas: 3                      # ≤ 12 (raw topic partitions); scale up to 12 max
  selector:
    matchLabels: { app: obs-enrichment-consumer }
  template:
    metadata:
      labels: { app: obs-enrichment-consumer }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9108"
    spec:
      terminationGracePeriodSeconds: 60   # finish + commit the in-flight batch
      containers:
        - name: consumer
          image: obs-enrichment-consumer:0.1.0
          envFrom:
            - secretRef: { name: obs-enrichment-secrets }   # SASL creds, PG DSN
            - configMapRef: { name: obs-enrichment-config }
          ports:
            - containerPort: 9108
              name: metrics
          resources:
            requests: { cpu: 250m, memory: 768Mi }   # GLiNER resident ~512Mi
            limits: { cpu: "1", memory: 1536Mi }
          livenessProbe:
            httpGet: { path: /metrics, port: 9108 }
            initialDelaySeconds: 30      # GLiNER model load
            periodSeconds: 15
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: obs-enrichment-config
  namespace: observability
data:
  OBS_ENRICH_ENVIRONMENT: "prod"
  OBS_ENRICH_KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
  OBS_ENRICH_GLINER_ENABLED: "true"
  OBS_ENRICH_S3_ENABLED: "true"
  OBS_ENRICH_S3_BUCKET: "ai-obs-archive-prod"
  OBS_ENRICH_QUALITY_SAMPLE_PCT: "5.0"
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: obs-enrichment-consumer
  namespace: observability
spec:
  selector:
    matchLabels: { app: obs-enrichment-consumer }
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
