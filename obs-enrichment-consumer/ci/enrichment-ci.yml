name: obs-enrichment-consumer

on:
  pull_request:
    paths: ["obs-enrichment-consumer/**", "observability-iac/contracts/**"]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obs-enrichment-consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check obs_enrichment tests
      - name: Unit tests (broker-free)
        run: pytest -v
      - name: Contract drift check
        run: |
          for f in event_schema.py event_types.py service_names.py; do
            diff obs_enrichment/contracts/$f ../observability-iac/contracts/$f \
              || { echo "::error::vendored contract $f drifted"; exit 1; }
          done
      - name: Docker build
        run: docker build -t obs-enrichment-consumer:ci .
